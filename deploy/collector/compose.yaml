# A Lakeflow collector on another server, for sites the stack's built-in collector cannot reach.
#
# In the console: Configuration, Sites and collectors, "Collector on another server". Save the file it gives you
# (lakeflow-collector.env) next to this one and run, once:
#   docker compose --env-file lakeflow-collector.env up -d --build
# It enrolls on first start (the token works once, within 24 hours) and trusts only your stack's CA, by the SHA-256 in
# that file. Later starts are just `docker compose up -d`; the file can be deleted once it has enrolled.
services:
  collector:
    image: lakeflow-collector
    build:
      context: ../..
      dockerfile: deploy/collector/Dockerfile
    restart: unless-stopped
    environment:
      LAKEFLOW_CONTROL_API: ${LAKEFLOW_CONTROL_API:-}
      LAKEFLOW_ENROLLMENT_TOKEN: ${LAKEFLOW_ENROLLMENT_TOKEN:-}
      LAKEFLOW_CA_SHA256: ${LAKEFLOW_CA_SHA256:-}
      TZ: America/New_York
    volumes:
      - data:/var/lib/lakeflow
      - secrets:/var/lib/lakeflow-secrets
    # Outbound only: HTTPS to the control API and Event Hubs, SQL to the sites. Nothing listens.

volumes:
  data:
  secrets:
